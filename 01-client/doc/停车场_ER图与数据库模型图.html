<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>停车场数据库 E-R 图与模型图</title>
  <style>
    * { box-sizing: border-box; }
    body {

      padding: 12px 16px 24px;
      font-family: SimSun, NSimSun, "Songti SC", STSong, serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .block {
      margin-bottom: 18px;
      background: #fff;
      padding: 12px 14px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      max-width: 980px;
    }
    .caption {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }
    .note {
      font-size: 13px;
      color: #444;
      margin-top: 8px;
      line-height: 1.45;
    }
    svg { display: block; vertical-align: top; }
    /* 紧凑：限制外边距 */
    .svg-wrap { overflow: auto; }
  </style>
</head>
<body>

  <div class="block">

    <div class="svg-wrap">

    </div>
    <p class="note">说明：符合 Chen 表示法；联系旁边 1 / n 为业务语义（库未声明外键）。「校验」：按车牌比对黑名单；「扣款」：出场按卡号扣 RFID 余额；「归档」：结账写入停车历史。场区配置与其余实体无联系字段。</p>
  </div>
