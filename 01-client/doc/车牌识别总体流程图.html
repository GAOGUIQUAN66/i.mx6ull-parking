<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>车牌识别总体流程图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: SimSun, NSimSun, "Songti SC", STSong, serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 14px;
      font-weight: 700;
      text-align: center;
    }
    .wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px 16px 18px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }
    svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>车牌识别总体流程图</h1>
    <!-- 标准流程图：椭圆=起止，圆角矩形=处理，菱形=判断，平行四边形=数据/IO -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="100%" style="font-family:SimSun,NSimSun,'Songti SC',STSong,serif;">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#37474f" />
        </marker>
        <style type="text/css"><![CDATA[
          .t-process { font-size: 25px; font-weight: 700; fill: #111; }
          .t-diamond { font-size: 23px; font-weight: 700; fill: #111; }
          .t-small { font-size: 20px; font-weight: 700; fill: #333; }
          .t-label { font-size: 20px; fill: #1565c0; font-weight: 700; }
          .t-end { font-size: 24px; font-weight: 700; fill: #111; }
        ]]></style>
      </defs>

      <!-- 起止：椭圆 -->
      <ellipse cx="500" cy="88" rx="88" ry="26" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
      <text x="500" y="94" text-anchor="middle" class="t-end">开始</text>

      <line x1="500" y1="114" x2="500" y2="132" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 处理：圆角矩形 -->
      <rect x="400" y="132" width="200" height="44" rx="8" fill="#90caf9" stroke="#1565c0" stroke-width="1.6"/>
      <text x="500" y="160" text-anchor="middle" class="t-process">V4L2 采帧</text>

      <line x1="500" y1="176" x2="500" y2="194" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="400" y="194" width="200" height="40" rx="8" fill="#80cbc4" stroke="#00695c" stroke-width="1.6"/>
      <text x="500" y="218" text-anchor="middle" class="t-process">水平镜像</text>

      <line x1="500" y1="234" x2="500" y2="252" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 判断：菱形 — 编码路径 -->
      <polygon points="500,252 610,292 500,332 390,292" fill="#fff59d" stroke="#f57f17" stroke-width="1.8"/>
      <text x="505" y="300" text-anchor="middle" class="t-diamond">QImage 或 RAW？</text>

      <!-- 分支：左 JPEG/BMP，右 RAW -->
      <line x1="390" y1="292" x2="260" y2="292" stroke="#37474f" stroke-width="2"/>
      <line x1="260" y1="292" x2="260" y2="316" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="330" y="278" class="t-label">QImage</text>

      <line x1="610" y1="292" x2="740" y2="292" stroke="#37474f" stroke-width="2"/>
      <line x1="740" y1="292" x2="740" y2="316" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="670" y="278" class="t-label">RAW</text>

      <rect x="140" y="316" width="240" height="44" rx="8" fill="#ffe082" stroke="#ff8f00" stroke-width="1.6"/>
      <text x="260" y="342" text-anchor="middle" class="t-process">JPEG(90) / BMP</text>

      <rect x="620" y="316" width="240" height="44" rx="8" fill="#ffe082" stroke="#ff8f00" stroke-width="1.6"/>
      <text x="740" y="342" text-anchor="middle" class="t-process">RAW 包（头+像素）</text>

      <line x1="260" y1="360" x2="260" y2="380" stroke="#37474f" stroke-width="2"/>
      <line x1="740" y1="360" x2="740" y2="380" stroke="#37474f" stroke-width="2"/>
      <line x1="260" y1="380" x2="500" y2="380" stroke="#37474f" stroke-width="2"/>
      <line x1="740" y1="380" x2="500" y2="380" stroke="#37474f" stroke-width="2"/>
      <line x1="500" y1="380" x2="500" y2="408" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="380" y="408" width="240" height="40" rx="8" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.6"/>
      <text x="500" y="432" text-anchor="middle" class="t-process">组帧：长+型+载</text>

      <line x1="500" y1="448" x2="500" y2="472" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 平行四边形：数据发送（输入输出类） -->
      <polygon points="420,472 660,472 680,520 440,520" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.6"/>
      <text x="560" y="502" text-anchor="middle" class="t-process">TCP 发送</text>

      <!-- 网络：平行四边形 定界 -->
      <line x1="560" y1="520" x2="560" y2="548" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <polygon points="380,548 740,548 760,596 400,596" fill="#ffe082" stroke="#ef6c00" stroke-width="1.6"/>
      <text x="580" y="578" text-anchor="middle" class="t-process">解包定界（5B 头）</text>

      <line x1="580" y1="596" x2="580" y2="624" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 判断：载荷类型 -->
      <polygon points="580,624 690,664 580,704 470,664" fill="#90caf9" stroke="#1565c0" stroke-width="1.8"/>
      <text x="585" y="671" text-anchor="middle" class="t-diamond">IMAGE 或 RAW？</text>

      <line x1="470" y1="664" x2="320" y2="664" stroke="#37474f" stroke-width="2"/>
      <line x1="320" y1="664" x2="320" y2="688" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="400" y="650" class="t-label">IMAGE</text>

      <line x1="690" y1="664" x2="820" y2="664" stroke="#37474f" stroke-width="2"/>
      <line x1="820" y1="664" x2="820" y2="688" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="740" y="650" class="t-label">RAW</text>

      <rect x="200" y="688" width="240" height="44" rx="8" fill="#81c784" stroke="#2e7d32" stroke-width="1.6"/>
      <text x="320" y="714" text-anchor="middle" class="t-process">解码 → BGR</text>

      <rect x="700" y="688" width="240" height="44" rx="8" fill="#81c784" stroke="#2e7d32" stroke-width="1.6"/>
      <text x="820" y="714" text-anchor="middle" class="t-process">RGB565→BGR</text>

      <line x1="320" y1="732" x2="320" y2="756" stroke="#37474f" stroke-width="2"/>
      <line x1="820" y1="732" x2="820" y2="756" stroke="#37474f" stroke-width="2"/>
      <line x1="320" y1="756" x2="580" y2="756" stroke="#37474f" stroke-width="2"/>
      <line x1="820" y1="756" x2="580" y2="756" stroke="#37474f" stroke-width="2"/>
      <line x1="580" y1="756" x2="580" y2="772" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="480" y="772" width="200" height="44" rx="8" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.6"/>
      <text x="580" y="798" text-anchor="middle" class="t-process">HyperLPR3</text>

      <line x1="580" y1="816" x2="580" y2="836" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="480" y="836" width="200" height="40" rx="8" fill="#ffab91" stroke="#d84315" stroke-width="1.6"/>
      <text x="580" y="860" text-anchor="middle" class="t-process">取置信度最高</text>

      <line x1="580" y1="876" x2="580" y2="896" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="400" y="896" width="360" height="44" rx="8" fill="#f48fb1" stroke="#ad1457" stroke-width="1.6"/>
      <text x="580" y="922" text-anchor="middle" class="t-process">回传 JSON / 可选 TTS</text>

      <line x1="580" y1="940" x2="580" y2="960" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 结束：椭圆 -->
      <ellipse cx="580" cy="994" rx="120" ry="28" fill="#d1c4e9" stroke="#4527a0" stroke-width="2"/>
      <text x="580" y="998" text-anchor="middle" class="t-end">板端显示与播报</text>

      <!-- 图例 -->
      <rect x="24" y="1048" width="952" height="62" fill="#eceff1" stroke="#90a4ae" stroke-width="1" rx="4"/>
      <text x="40" y="1072" class="t-small">图例：</text>
      <ellipse cx="110" cy="1078" rx="36" ry="12" fill="#bbdefb" stroke="#1565c0"/>
      <text x="160" y="1082" class="t-small">起止</text>
      <rect x="210" y="1066" width="56" height="22" rx="5" fill="#90caf9" stroke="#1565c0"/>
      <text x="280" y="1082" class="t-small">处理</text>
      <polygon points="340,1066 360,1078 340,1090 320,1078" fill="#fff59d" stroke="#f57f17"/>
      <text x="375" y="1082" class="t-small">判断</text>
      <polygon points="430,1064 490,1064 500,1086 420,1086" fill="#a5d6a7" stroke="#2e7d32"/>
      <text x="515" y="1082" class="t-small">数据</text>
    </svg>
    <p class="note">椭圆=起止，圆角矩形=处理，菱形=判断，平行四边形=数据。</p>
  </div>
</body>
</html>
