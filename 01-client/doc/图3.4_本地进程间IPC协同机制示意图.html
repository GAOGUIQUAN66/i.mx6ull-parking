<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>图3.4 本地进程间IPC协同机制示意图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", SimHei, sans-serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      font-weight: 700;
      text-align: center;
    }
    .wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      max-width: 920px;
      margin: 0 auto;
    }
    .note {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>图3.4　本地进程间 IPC 协同机制示意图</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="FIFO 数据通道与 POSIX 信号量同步">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
        <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
        </marker>
      </defs>

      <!-- 进程框 -->
      <rect x="40" y="160" width="140" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      <text x="110" y="188" text-anchor="middle" font-size="15" font-weight="bold">RFID 进程</text>
      <text x="110" y="206" text-anchor="middle" font-size="12" fill="#444">（生产者）</text>

      <rect x="260" y="160" width="140" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
      <text x="330" y="188" text-anchor="middle" font-size="15" font-weight="bold">视频进程</text>
      <text x="330" y="206" text-anchor="middle" font-size="12" fill="#444">（消费者/生产者）</text>

      <rect x="480" y="160" width="150" height="56" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
      <text x="555" y="188" text-anchor="middle" font-size="15" font-weight="bold">数据管理进程</text>
      <text x="555" y="206" text-anchor="middle" font-size="12" fill="#444">（SQLite）</text>

      <rect x="710" y="160" width="130" height="56" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
      <text x="775" y="188" text-anchor="middle" font-size="15" font-weight="bold">语音播报进程</text>
      <text x="775" y="206" text-anchor="middle" font-size="12" fill="#444">（消费者）</text>

      <!-- FIFO 箭头与标注 -->
      <line x1="180" y1="188" x2="260" y2="188" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="188" y="168" width="72" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="224" y="184" text-anchor="middle" font-size="11">rfid_to_video</text>

      <line x1="400" y1="188" x2="480" y2="188" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="398" y="168" width="88" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="442" y="184" text-anchor="middle" font-size="11">video_to_sqlite</text>

      <line x1="630" y1="188" x2="710" y2="188" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="638" y="168" width="78" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="677" y="184" text-anchor="middle" font-size="11">sqlite_to_audio</text>

      <!-- 载荷说明 -->
      <text x="220" y="158" text-anchor="middle" font-size="11" fill="#555">卡号字符串</text>
      <text x="440" y="158" text-anchor="middle" font-size="11" fill="#555">卡号:车牌号</text>
      <text x="670" y="158" text-anchor="middle" font-size="11" fill="#555">播报文本</text>

      <!-- 信号量：RFID post -> Video wait（弧线避免与管道重叠） -->
      <path d="M 110 160 Q 220 40 330 160" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowDash)"/>
      <text x="220" y="48" text-anchor="middle" font-size="12" fill="#b71c1c" font-weight="bold">sem_takephoto</text>
      <text x="130" y="95" font-size="11" fill="#c62828">sem_post()</text>
      <text x="268" y="95" text-anchor="end" font-size="11" fill="#c62828">sem_wait()</text>

      <!-- 图例 -->
      <rect x="40" y="300" width="800" height="96" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
      <text x="56" y="324" font-size="13" font-weight="bold">图例</text>
      <line x1="56" y1="342" x2="96" y2="342" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="104" y="347" font-size="12">有名管道（FIFO）：半双工字节流，阻塞读写</text>
      <line x1="56" y1="366" x2="96" y2="366" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
      <text x="104" y="371" font-size="12">POSIX 有名信号量：事件触发，避免视频进程空转轮询</text>
      <text x="56" y="392" font-size="11" fill="#555">说明：箭头表示数据或同步方向；视频进程在 sem_wait(sem_takephoto) 处阻塞，直至 RFID 进程刷卡后 sem_post。</text>
    </svg>
    <p class="note">使用方式：用浏览器打开本文件，缩放至合适大小后截图插入 Word；或在浏览器中打印为 PDF。若需矢量图，可将本页另存或导出 PDF 后在矢量工具中微调。</p>
  </div>
</body>
</html>
