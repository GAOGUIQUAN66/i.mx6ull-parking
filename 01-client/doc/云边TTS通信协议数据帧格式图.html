<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>云边 TTS 通信协议数据帧格式图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: SimSun, NSimSun, "Songti SC", STSong, serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 14px;
      font-weight: 700;
      text-align: center;
    }
    .wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px 18px 18px;
      max-width: 980px;
      margin: 0 auto;
    }
    .note {
      font-size: 14px;
      color: #444;
      margin-top: 10px;
      line-height: 1.5;
    }
    svg { display: block; margin: 0 auto; max-width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>云边 TTS 通信协议数据帧格式图</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="auto" style="font-family:SimSun,NSimSun,'Songti SC',STSong,serif;">
      <defs>
        <style type="text/css"><![CDATA[
          .sum { font-size: 15px; fill: #333; }
          .sum-bold { font-size: 17px; fill: #111; font-weight: bold; }
          .bit-top { font-size: 20px; fill: #0d47a1; font-weight: 600; }
          .lbl-side { font-size: 25px; fill: #1a237e; font-weight: bold; }
          .in-box { font-size: 25px; fill: #111; font-weight: 700; }
          .sub-hint { font-size: 20px; fill: #333; font-weight: 700; }
          /* 勿写 fill:none，否则会盖住矩形自身的 fill 属性 */
          .rb { stroke: #37474f; stroke-width: 1.2; }
        ]]></style>
      </defs>

      <!-- 各行浅色底带（置于格子下层，便于区分四行） -->
      <rect x="96" y="106" width="796" height="60" fill="#e8eaf6" opacity="0.65"/>
      <rect x="96" y="180" width="796" height="62" fill="#e8f5e9" opacity="0.55"/>
      <rect x="96" y="252" width="796" height="62" fill="#fff8e1" opacity="0.55"/>
      <rect x="96" y="330" width="796" height="62" fill="#fce4ec" opacity="0.5"/>

      <text x="460" y="28" text-anchor="middle" class="sum-bold">帧格式共性</text>
      <text x="460" y="50" text-anchor="middle" class="sum">Len：无符号 N（大端）｜Typ：类型｜Pay：N 字节｜整帧（5+N）B →（40+8N）bit</text>

      <!-- 通用：每格一色 -->
      <text x="118" y="140" text-anchor="end" class="lbl-side" dominant-baseline="middle">通用</text>
      <text x="178" y="100" text-anchor="middle" class="bit-top">32 bit</text>
      <text x="292" y="100" text-anchor="middle" class="bit-top">8 bit</text>
      <text x="602" y="100" text-anchor="middle" class="bit-top">8N bit</text>
      <rect x="128" y="114" width="140" height="52" fill="#90caf9" class="rb"/>
      <rect x="268" y="114" width="88" height="52" fill="#80cbc4" class="rb"/>
      <rect x="356" y="114" width="532" height="52" fill="#fff59d" class="rb"/>
      <text x="198" y="146" text-anchor="middle" class="in-box">Length</text>
      <text x="312" y="146" text-anchor="middle" class="in-box">Type</text>
      <text x="622" y="146" text-anchor="middle" class="in-box">Payload</text>

      <!-- 文本 -->
      <text x="118" y="211" text-anchor="end" class="lbl-side" dominant-baseline="middle">文本</text>
      <rect x="128" y="184" width="140" height="54" fill="#a5d6a7" class="rb"/>
      <rect x="268" y="184" width="88" height="54" fill="#81c784" class="rb"/>
      <rect x="356" y="184" width="532" height="54" fill="#dcedc8" class="rb"/>
      <text x="198" y="214" text-anchor="middle" class="in-box">N</text>
      <text x="312" y="214" text-anchor="middle" class="in-box">0x02</text>
      <text x="622" y="208" text-anchor="middle" class="in-box">JSON（tts）</text>
      <text x="622" y="230" text-anchor="middle" class="sub-hint">~64 B～4 KB</text>

      <!-- 音频：五段五色 -->
      <text x="118" y="283" text-anchor="end" class="lbl-side" dominant-baseline="middle">音频</text>
      <rect x="128" y="256" width="140" height="54" fill="#ffab91" class="rb"/>
      <rect x="268" y="256" width="88" height="54" fill="#ffcc80" class="rb"/>
      <rect x="356" y="256" width="100" height="54" fill="#ce93d8" class="rb"/>
      <rect x="456" y="256" width="188" height="54" fill="#80deea" class="rb"/>
      <rect x="644" y="256" width="244" height="54" fill="#b39ddb" class="rb"/>
      <text x="198" y="286" text-anchor="middle" class="in-box">N</text>
      <text x="312" y="286" text-anchor="middle" class="in-box">0x05</text>
      <text x="406" y="286" text-anchor="middle" class="in-box">meta</text>
      <text x="550" y="286" text-anchor="middle" class="in-box">JSON</text>
      <text x="766" y="286" text-anchor="middle" class="in-box">WAV</text>
      <text x="550" y="304" text-anchor="middle" class="sub-hint">~64～512 B</text>
      <text x="766" y="304" text-anchor="middle" class="sub-hint">~4～64 KB</text>

      <!-- 识别 -->
      <text x="118" y="361" text-anchor="end" class="lbl-side" dominant-baseline="middle">识别</text>
      <rect x="128" y="334" width="140" height="54" fill="#f48fb1" class="rb"/>
      <rect x="268" y="334" width="88" height="54" fill="#ff80ab" class="rb"/>
      <rect x="356" y="334" width="532" height="54" fill="#e1bee7" class="rb"/>
      <text x="198" y="364" text-anchor="middle" class="in-box">N</text>
      <text x="312" y="364" text-anchor="middle" class="in-box">0x03</text>
      <text x="622" y="356" text-anchor="middle" class="in-box">JSON（plate）</text>
      <text x="622" y="378" text-anchor="middle" class="sub-hint">~48 B～512 B</text>
    </svg>
    <p class="note">N 为 Len 段给出的载荷字节数；音频 Pay＝meta+JSON+WAV；「~」为常见量级。实现见 NetworkClient 与 send_audio / send_result。</p>
  </div>
</body>
</html>
