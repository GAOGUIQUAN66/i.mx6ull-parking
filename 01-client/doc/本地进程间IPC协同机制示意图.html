<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>本地线程间协同机制示意图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", SimHei, sans-serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 700;
      text-align: center;
    }
    .wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      max-width: 960px;
      margin: 0 auto;
    }
    .note {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>图4.3　本地线程间协同机制示意图</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="Qt 信号槽线程间协同">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
        <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
        </marker>
      </defs>

      <rect x="50" y="160" width="130" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      <text x="120" y="190" text-anchor="middle" font-size="22" font-weight="bold">RFID 线程</text>
      <text x="120" y="212" text-anchor="middle" font-size="18" fill="#444">（采集）</text>

      <rect x="260" y="160" width="140" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
      <text x="330" y="190" text-anchor="middle" font-size="22" font-weight="bold">视频线程</text>
      <text x="330" y="212" text-anchor="middle" font-size="18" fill="#444">（采集/上传）</text>

      <rect x="485" y="160" width="150" height="62" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
      <text x="557" y="190" text-anchor="middle" font-size="22" font-weight="bold">数据管理模块</text>
      <text x="564" y="212" text-anchor="middle" font-size="18" fill="#444">（SQLite）</text>

      <rect x="715" y="160" width="150" height="62" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
      <text x="795" y="190" text-anchor="middle" font-size="22" font-weight="bold">语音播报线程</text>
      <text x="795" y="212" text-anchor="middle" font-size="18" fill="#444">（aplay）</text>

      <line x1="180" y1="195" x2="260" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="168" y="166" width="104" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="220" y="181" text-anchor="middle" font-size="13">上报卡号</text>

      <line x1="400" y1="195" x2="485" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="388" y="166" width="108" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="442" y="181" text-anchor="middle" font-size="13">车牌与卡号</text>

      <line x1="635" y1="195" x2="715" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="625" y="166" width="100" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="675" y="181" text-anchor="middle" font-size="13">播报文本</text>

      <text x="217" y="162" text-anchor="middle" font-size="16" fill="#555">卡号字符串</text>
      <text x="438" y="162" text-anchor="middle" font-size="16" fill="#555">卡号:车牌号</text>
      <text x="672" y="162" text-anchor="middle" font-size="16" fill="#555">待播文本</text>

      <path d="M 110 160 Q 200 78 330 160" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowDash)"/>
      <text x="198" y="88" text-anchor="middle" font-size="20" fill="#b71c1c" font-weight="bold">抓拍请求</text>
      <text x="100" y="112" font-size="18" fill="#c62828">有效卡号</text>
      <text x="290" y="112" text-anchor="end" font-size="18" fill="#c62828">触发抓拍</text>

      <rect x="355" y="248" width="170" height="44" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
      <text x="440" y="276" text-anchor="middle" font-size="18" font-weight="bold">主窗口（调度核心）</text>

      <line x1="440" y1="248" x2="120" y2="222" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="440" y1="248" x2="330" y2="222" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="440" y1="248" x2="560" y2="222" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="440" y1="248" x2="795" y2="222" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="4 3"/>

      <rect x="40" y="310" width="800" height="100" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
      <text x="56" y="338" font-size="16" font-weight="bold">图例</text>
      <line x1="56" y1="360" x2="96" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="104" y="366" font-size="15">Qt 信号槽：线程间传递卡号、车牌、播报文本等业务数据</text>
      <line x1="56" y1="388" x2="96" y2="388" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
      <text x="104" y="394" font-size="15">事件触发：主窗口收到有效卡号后向视频线程下发抓拍请求</text>
    </svg>
    <p class="note">使用方式：用浏览器打开本文件，缩放至合适大小后截图插入 Word；或在浏览器中打印为 PDF。</p>
  </div>
</body>
</html>
