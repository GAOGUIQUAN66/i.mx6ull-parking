<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>图3.6 云边协同语音合成交互时序图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: SimSun, NSimSun, "Songti SC", STSong, serif;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 14px;
      font-weight: 700;
      text-align: center;
    }
    .wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px 18px 18px;
      max-width: 980px;
      margin: 0 auto;
    }
    .note {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-top: 12px;
      line-height: 1.55;
    }
    svg { display: block; margin: 0 auto; max-width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>图3.6　云边协同语音合成交互时序图</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" height="auto" style="font-family:SimSun,NSimSun,'Songti SC',STSong,serif;">
      <defs>
        <style type="text/css"><![CDATA[
          .life { font-size: 17px; font-weight: 700; fill: #0d47a1; }
          .msg { font-size: 16px; font-weight: 700; fill: #111; }
          .box-title { font-size: 15px; font-weight: 700; fill: #111; }
          .box-sub { font-size: 13px; font-weight: 700; fill: #333; }
          .box-note { font-size: 13px; font-weight: 700; fill: #424242; }
        ]]></style>
        <marker id="arr" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto">
          <path d="M0,0 L0,7 L10,3.5 z" fill="#1565c0" />
        </marker>
        <marker id="arrD" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto">
          <path d="M0,0 L0,7 L10,3.5 z" fill="#c62828" />
        </marker>
      </defs>

      <!-- 生命线 -->
      <text x="140" y="40" text-anchor="middle" class="life">sqlite_to_audio（FIFO）</text>
      <text x="360" y="40" text-anchor="middle" class="life">音频进程（客户端）</text>
      <text x="640" y="40" text-anchor="middle" class="life">云端服务（Ubuntu·TTS）</text>
      <line x1="140" y1="48" x2="140" y2="560" stroke="#78909c" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="360" y1="48" x2="360" y2="560" stroke="#78909c" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="640" y1="48" x2="640" y2="560" stroke="#78909c" stroke-width="1.4" stroke-dasharray="5 4"/>

      <!-- ① -->
      <line x1="140" y1="118" x2="350" y2="118" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="245" y="110" text-anchor="middle" class="msg">① 读取待播报文本</text>

      <!-- ② -->
      <line x1="360" y1="168" x2="630" y2="168" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="495" y="160" text-anchor="middle" class="msg">② 发送文本帧（Len+Typ+JSON）</text>

      <!-- ③ -->
      <rect x="548" y="188" width="184" height="54" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="640" y="212" text-anchor="middle" class="box-title">③ TTS 合成 WAV</text>
      <text x="640" y="232" text-anchor="middle" class="box-sub">（云端引擎）</text>

      <!-- ④ -->
      <line x1="640" y1="268" x2="370" y2="268" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrD)"/>
      <text x="505" y="260" text-anchor="middle" class="msg">④ 先发长度信息（论文：独立 4B；实现见注）</text>

      <!-- ⑤ -->
      <line x1="640" y1="322" x2="370" y2="322" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="505" y="314" text-anchor="middle" class="msg">⑤ 再发音频数据（论文：分片；实现见注）</text>

      <!-- ⑥⑦ -->
      <rect x="248" y="358" width="224" height="92" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
      <text x="360" y="388" text-anchor="middle" class="box-title">⑥ 根据长度分配缓冲区</text>
      <text x="360" y="412" text-anchor="middle" class="box-title">⑦ 循环接收直至累计 N 字节</text>
      <text x="360" y="436" text-anchor="middle" class="box-note">（解析缓冲拼包）</text>

      <!-- ⑧ -->
      <rect x="258" y="468" width="204" height="52" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
      <text x="360" y="500" text-anchor="middle" class="box-title">⑧ ALSA 写入声卡播放</text>
    </svg>
    <p class="note"><strong>与源码对应：</strong>板端网络模块发送 TTS 请求（文本类型 JSON）；云端合成 WAV 后以音频类型封包返回，载荷含大端 meta 长度、JSON 头与 WAV。论文中④⑤「先发长度再分片」对应 UDP 叙述；当前工程多在<strong>一次 TCP 应答</strong>内携带长度前缀与完整音频流，接收端仍按载荷内长度拼缓冲后播放，与⑥⑦一致。</p>
  </div>
</body>
</html>
